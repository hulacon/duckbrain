[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckbrain"
# Single-sourced from src/duckbrain/__init__.py (see [tool.hatch.version]).
# duckbrain is served from a git checkout, so the literal belongs somewhere
# importable without a build step — and a second copy here would drift silently.
dynamic = ["version"]
description = "General-purpose neuroimaging toolbox with Streamlit GUI for LCNI/Talapas HPC"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    # 1.56 is where ``st.iframe`` landed. ``gui.components.embed_tool_report``
    # needs it: the ``st.components.v1.html`` it replaced is past its announced
    # removal date (2026-06-01), and the day a user's upgrade drops it, every
    # embedded MRIQC/fMRIPrep report goes blank. Floor rather than fallback —
    # a second code path nobody runs is worse than a version we can state.
    "streamlit>=1.56",
    "jinja2>=3.1",
    "pandas>=2.0",
    "nibabel>=5.0",
    "plotly>=5.0",
    "pydicom>=2.4",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # Bounded to one minor, because the formatter is a *gate*: unpinned, CI
    # re-resolves it on every run, so the same commit passes one day and fails
    # the next with nothing in the repo having changed. That is not hypothetical
    # — 0.16 promoted Markdown formatting out of preview, picked up the Python
    # blocks in docs/*.md for the first time, and turned main red on three
    # commits that touched none of them. Raise the bound deliberately, in its own
    # commit, so a restyle is reviewed rather than discovered.
    "ruff>=0.16,<0.17",
    # Bounded for the same reason as ruff, plus one of its own: mypy ships new
    # checks *and* a new bundled typeshed in every minor, so an unpinned gate
    # re-resolves in CI and the same commit goes red with nothing in the repo
    # having changed — third-party stubs it never saw before are enough to do it.
    # Raise the bound in its own commit so new diagnostics are reviewed rather
    # than discovered. Patch is deliberately unpinned; those are bug fixes.
    "mypy>=2.3,<2.4",
]

[tool.hatch.version]
path = "src/duckbrain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/duckbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is NOT in addopts: it costs ~25% wall clock on every local run, and
# the floor below is only meaningful on a full-suite run anyway. CI adds the
# --cov flags; a single test file run locally stays fast.

[tool.coverage.run]
# A **path**, not the package name, and the difference is the whole reason the
# Streamlit pages were invisible to this gate for a week. Coverage resolves a
# package-name source by *module name*: streamlit's ScriptRunner execs a page as
# a fresh module named `5_QC_Overview`, which is not a `duckbrain` submodule and
# is not even a legal Python identifier, so it could never match no matter where
# the file sat. `COVERAGE_DEBUG=trace` says so outright — "module '5_QC_Overview'
# falls outside the --source spec". A path source matches by directory instead,
# and traces the pages fine.
#
# The caveat that buys: this measures the source *tree*, so it is right only
# because the install is editable and pytest runs from the repo root. Both hold
# in CI and in the documented local gate. A non-editable install would report 0%
# everywhere — which fails loudly rather than degrading quietly, so it is an
# acceptable trade, but it is a trade.
#
# A `--cov=<value>` on the pytest command line *overrides* this. That is why CI
# and CLAUDE.md both pass a bare `--cov`.
source = ["src/duckbrain"]

# Branch coverage, not just statements, because the difference is exactly this
# project's failure mode. Statement coverage asks "did this line run"; an `if`
# with no `else` has no line for its fall-through, so a condition that only ever
# went one way still reports as fully covered. duckbrain is an orchestrator whose
# characteristic bug is a path that quietly does the wrong thing — inverted
# fieldmap intent, an anat-reuse flag that no-ops, a twin guard that hid 26 of 26
# twins on a scanner writing neither token. Every one of those was a one-directional
# condition in code that ran fine.
#
# Found its first one immediately: `write_dataset_description`'s
# "don't blank an existing GeneratedBy" branch had never executed, because every
# test happened to pass one. Statement coverage called that line covered.
#
# Turning this on *lowers* the reported total (87.42% -> 85.99%) and that is not a
# regression — it is a stricter denominator. Don't compare a branch-inclusive
# figure against a statement-only one from before this line existed.
branch = true

[tool.coverage.report]
# A ratchet, not a target. The floor sits about a point under the last measured
# total, so a statement-count difference between Python versions can't fail CI on
# its own. Raise it when coverage rises — never lower it to make a red build
# green.
#
# This number counts **branches as well as statements** (see `branch = true`
# above), so it is not comparable to the pre-2026-08-03 values in git history:
# 85 here is stricter than the 86 it replaced, not looser. The one time it is
# legitimate to lower this is a change that widens the denominator the way that
# one did — and then the commit message has to say so.
#
# **Measure with the container runtime absent before you raise this.** A Talapas
# dev box has `singularity` on PATH and a `~/.config/duckbrain` naming a real
# containers_dir, so code that inspects an image actually runs and reports ~0.5
# points higher than CI, which has neither: 86.01% locally against 85.45% on a
# runner, at the time this was written. The gating number is the lower one, so
# the slack here is thinner than a local run suggests. Reproduce CI with a PATH
# that hides singularity/apptainer and DUCKBRAIN_USER_CONFIG pointed at a
# nonexistent file — the same check that catches tests which assert a property of
# the machine, which is what broke the build for four commits on 2026-08-03.
#
# Now that the pages are measured, the QC pages are the pattern to copy rather
# than admire: they are four-statement declarations calling one tested module
# (`gui.qc_panels`), so splitting one 108-statement page into five *raised* the
# total. A page that holds logic is a page that holds untested logic.
fail_under = 89

[tool.ruff]
line-length = 100

# Where ruff looks to decide an import is *ours*. Load-bearing for isort, and
# `tests` is the part that isn't obvious: the test files import each other's
# helpers (`from test_conversion_plan import _bold, _plan, _series`), which is
# legal because pytest puts `tests/` on `sys.path` — but without `tests` listed
# here ruff classifies those as third-party and sorts them *above* `duckbrain`,
# which is the wrong answer as well as a bigger diff.
#
# `known-first-party` below then says the same thing about the package a second
# way. That is deliberate rather than redundant: `src` makes ruff resolve the
# name by probing the filesystem, so the classification would depend on what
# happens to be on disk — and a gate whose answer differs between a dev box and
# a CI runner is the exact failure that cost this repo four red commits
# (memory/local-tests-are-not-ci-tests).
src = [".", "src", "tests"]

[tool.ruff.lint]
# Started as pycodestyle + pyflakes only, deliberately. That was the first gate
# the repo had ever had; a wider ruleset would have meant a large mechanical diff
# competing for attention with the two real bugs the narrow one found (a missing
# `Path` import in an annotation, and a dead series lookup in
# `_fmap_description`). It has been widened a ruleset at a time since, each with
# its own commit and each measured before it was selected.
#
# `B` (flake8-bugbear) is the first widening, and the reason to start here is
# `B905`: `zip()` silently truncates to the shorter argument, so two sequences
# that *should* be the same length diverging is not an error, it is missing
# output. That is this project's characteristic failure mode — the same shape as
# an inverted fieldmap intent or a twin guard that hid 26 of 26 twins: code that
# runs fine and quietly does less than it says. `strict=` forces the question to
# be answered per site rather than assumed, and the answers here are not
# uniform — three `core/` sites document an unequal zip as intended behaviour and
# take `strict=False`, while the two GUI sites zip against `st.columns(len(X))`,
# where the length *is* the argument, and take `strict=True`.
#
# The one `B023` is a false positive with a `noqa` and a stated reason; nothing
# in the codebase defers a closure built in a loop.
#
# `I` (isort) is the second, and it is purely mechanical — it found no bug and
# was never going to. It earns its place by making import order a thing nobody
# has to think about or review again, which is worth one 47-site diff once. See
# `src` above for the setting that makes its answer correct, and
# `[tool.ruff.lint.isort]` below.
#
# `UP` (pyupgrade) is the third, and the smallest — 7 findings, all autofixed.
# Five were quoted annotations, which deserved a moment given that the *narrow*
# first ruleset caught a real bug that was a missing `Path` import in an
# annotation. Unquoting cannot reintroduce that: every one of those sites is in
# a module carrying `from __future__ import annotations`, there is no
# `TYPE_CHECKING` block or `get_type_hints` call anywhere in the repo, so no
# annotation is ever evaluated — and a name that isn't imported is now a
# *pyflakes* error instead of a string nobody reads.
#
# `TD` + `FIX` are not part of that sequence and cost no diff at all — they were
# already at zero findings when enabled. They are here to make a rule CLAUDE.md
# states in prose into one the gate states: **open work goes in `TODO.md` and
# nowhere else**, because a `# TODO:` in source is a second backlog that nothing
# sorts, prioritizes or reads. The repo has zero and this is what keeps it there.
#
# `FIX001`/`FIX002` are the enforcing half — they fire on any leading `# TODO:`
# or `# FIXME:` regardless of how well-formed it is, so a well-authored one with
# an issue link doesn't slip past. `TD001` additionally rejects `FIXME`/`XXX`/
# `HACK` as tags. What none of them touch is the *citation* style CLAUDE.md does
# sanction — a mid-sentence `(TODO #17.2)` pointing at an item that exists
# elsewhere — because these rules only match a comment's leading tag. Verified
# against both forms before enabling.
#
# `RUF100` is the one rule, not the ruleset — the rest of `RUF` is 28 findings
# with no defect behind any of them (see TODO #33.3 for each verdict; the
# `ambiguous-unicode` ones are the GUI's deliberate `➕` / `ℹ` / `×` glyphs).
# It is the ruff counterpart of mypy's `warn_unused_ignores` above, and it
# earned its place: all 9 findings were `noqa`s suppressing nothing. Six named
# `E402` in files `per-file-ignores` already exempts, so they read as the thing
# holding the import order down when the config was; three named `BLE001`, a
# ruleset never selected here. A directive nobody re-checks is a claim about
# current state that decays into a false one, which is the same reason the repo
# has no `# TODO:` markers.
#
# The three `BLE001` reasons were kept as ordinary comments when the directive
# went — the prose said something true about why a bare `except Exception` is
# right at a DICOM read, and only the machine-readable half was stale. Enabling
# `BLE` later means re-adding three directives, deliberately, with the reason
# already sitting there.
select = ["B", "E", "F", "FIX", "I", "RUF100", "TD", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages must call st.set_page_config() before anything else touches
# st, and they import modules *after* a config guard that may st.stop(). Imports
# genuinely cannot all sit at the top of these files.
"src/duckbrain/gui/pages/*" = ["E402"]
# The test suite groups an import with the narrative section that uses it, which
# is how these files stay readable at ~500 lines.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["duckbrain"]
# Deliberately NOT `lines-after-imports = 2`. It reads like it would only affect
# the top of a file, but it applies to *function-local* import blocks too — which
# both the Streamlit pages and the test suite use heavily — and takes this
# ruleset from 47 findings to 102, all of them blank lines. The default already
# matches what `ruff format` wants at module level.
#
# Nothing here overrides the E402 ignores above, and nothing needs to: ruff's
# isort sorts each *contiguous* block on its own, so on a page whose imports sit
# after an `st.set_page_config` / config guard, the blocks either side of the
# guard are sorted separately and no import is ever moved across it.

[tool.mypy]
# Type checking, scoped on purpose. The whole package is ~91% annotated already
# (543 functions in `src`, 44 missing a return type, 87 of 998 parameters bare),
# so repo-wide is not distant — but it is a different job, because the Streamlit
# pages are where the gaps concentrate (`0_Project_Status.py` alone holds 61 of
# the 131) and they are what drags streamlit, plotly and nibabel into the
# analysis. These modules were chosen instead because they are the *clean* 15%:
# their functions were already fully annotated, and none of them imports a
# third-party library directly.
#
# So this is a **ratchet**, exactly like the coverage floor — it holds a property
# these files already have. Widen the list a file at a time, and *measure first*:
# that is why every widening so far has landed green, and once it is why a
# widening happened at all. `pipeline.py` was filed as the expensive one — "the
# pandas boundary, wants `disallow_any_generics` settled first" — and measuring
# said the opposite. The whole bill was 9 signatures and **zero** body errors
# under `--check-untyped-defs`, because pandas is `Any` here (see the override
# below), so the boundary this analysis was supposed to founder on is the one
# place it cannot complain. The estimate had counted 28 annotation *gaps* and
# read them as 28 units of risk; they were 9 functions and no risk at all.
#
# The Streamlit pages were "the real job" here for two revisions of this comment,
# on the theory that gating them meant taking on streamlit, plotly and nibabel
# stubs. Measured, the whole `gui/` tree was 115 errors and **not one of them
# named a third-party package**. The friction was entirely first-party and came
# apart into a dataclass, two renames, five dead functions and a pile of
# signatures. Every page is gated now; what is left out is `qc_panels.py` and
# `conversion_panels.py`, for the seven errors in TODO #33.1 piece 4.
#
# A page's module name starts with a digit, which is not a legal Python
# identifier — mypy takes the directory anyway and checks all eleven. Verified by
# deleting one `-> None` and watching the gate go red, because a checker that
# silently skips a file looks exactly like a checker that passes it.
#
# It has never been free, which is the point of measuring before setting the
# knobs.
#
# The first three files found five errors, all one shape — a name bound to two
# unrelated things in one long function (`expected` meaning both a
# phase-encoding direction and a list of dropped series, 130 lines apart in
# `plan_warnings`; `run` meaning both a BOLD's counted index and an SBRef's
# possibly-absent one). Fixed by renaming, not by annotating around.
#
# `pipeline.py` found nothing new, but annotating `_job_state_maps` turned two
# more `dict[str, object]` maps into `dict[str, JobInfo]` — same shrug as the
# header field below, and the reason `survey_live` could read `job.state` off
# something declared to have no attributes at all.
#
# `dicom_inspect` + `series_types` found three, and the one worth recording is
# that `SeriesInfo.header` was declared `object | None`. Nothing enforced that,
# so it read as a shrug rather than a claim — but callers believed it, and four
# sites across three modules reached the field through
# `getattr(s.header, "series_time", None)`, a spelling that cannot distinguish
# "no header" from "this header has no such attribute" and would have gone on
# quietly returning `None` if the attribute were ever renamed. It is
# `SeriesHeader | None` now and those four are direct attribute access. The lie
# was also the only thing the deferred `from .dicom_header import …` bought, so
# that import is at module scope now (`dicom_header` imports nothing
# first-party, and pydicom only inside its own functions — there was never a
# cycle or a load cost to dodge).
# The floor is what has to typecheck. But this is *not* independent of which
# interpreter runs mypy, which is the trap it took a red build to find: it makes
# mypy parse every third-party stub with 3.10 grammar too, and a package that
# requires a newer Python may ship stubs written in newer syntax (numpy 2.5 uses
# PEP 695 `type X = ...`). A stub it cannot parse is a *blocking* error — mypy
# exits 2 having checked nothing. So the CI job that runs this pins Python 3.10 to
# match, which makes the mismatch impossible: anything pip resolves for 3.10 is
# something that supports 3.10. Change one and change the other.
python_version = "3.10"
files = [
    "src/duckbrain/core/conversion_plan.py",
    "src/duckbrain/core/dcm2bids_config.py",
    "src/duckbrain/core/consistency.py",
    "src/duckbrain/core/dicom_inspect.py",
    "src/duckbrain/core/series_types.py",
    "src/duckbrain/core/pipeline.py",
    "src/duckbrain/gui/app.py",
    "src/duckbrain/gui/components.py",
    "src/duckbrain/gui/preproc_panels.py",
    "src/duckbrain/gui/pages/",
]

# The containment mechanism, and the reason the list above can stay short.
# `mypy --verbose` parses 25 first-party modules to check these six — the other
# 19 (`surveyor`, `dicom_header`, `nordic`, `conversion`, `slurm.submit`, …) are
# followed silently: their types are read while no error is reported *in* them,
# which is what makes typing `consistency.py`'s calls into `surveyor` worth
# anything. Not `"skip"` — that types all 19 as `Any` and throws the value away.
follow_imports = "silent"

# Free today (146/146 functions annotated) and the whole point: without these, a
# new untyped function in one of these files typechecks fine and the file
# quietly stops being covered by the thing it is listed for.
disallow_untyped_defs = true
disallow_incomplete_defs = true

warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

# Both of these were filed as declined and both measured free, which is the
# whole argument for re-measuring a decline rather than inheriting it.
#
# `disallow_untyped_calls` was declined as "fires on every call into a silently
# followed module, i.e. a whole-repo project wearing a per-module flag." It
# fires zero times: `silent` *reads* types, it does not discard them, and the 19
# modules in the closure are the well-annotated part of the repo. What it buys
# is a ratchet that reaches past the file list — an untyped new function in
# `surveyor.py` is now a build error even though `surveyor.py` is not gated.
# Expect that error to be reported at the *call site*, in a file the author may
# not have touched.
#
# `warn_return_any` was declined as "noisy against untyped pandas". It was 3
# errors, none of them pandas, and one was a live bug: `consistency._read_json`
# promised `-> dict` while returning `json.load(...)`, so `null` / `[]` / a bare
# string — all valid JSON, none a sidecar — sailed past the `except ValueError`
# that exists to absorb exactly that, and the caller's `.get()` raised
# AttributeError out of a checker written never to raise. Pinned by
# tests/test_consistency.py::test_valid_json_that_is_not_an_object_reads_as_unreadable.
# The other two returned a group name typed `Any` out of `FieldmapDetection`'s
# bare `groups: dict`; that dataclass's four fields are spelled out now.
#
# Still declined:
#   disallow_any_generics — 90 errors, and the real ones are the dcm2bids
#     description dicts, which need actual TypedDicts (with `NotRequired`, which
#     the 3.10 floor can't have without `typing_extensions`). Filed in TODO #33.2.
#   strict — turns that on along with these two.
disallow_untyped_calls = true
warn_return_any = true

[[tool.mypy.overrides]]
# The one stub gap that reaches this analysis, named rather than blanketed —
# pandas is the only package in the closure shipping no `py.typed`. streamlit,
# nibabel and plotly are not in the closure at all, which is the clearest
# evidence `core/` was the right place to start.
#
# It only started doing anything when `pipeline.py` joined the list above.
# Before that, pandas was reached solely through silently-followed modules, and
# `follow_imports = "silent"` was already swallowing the missing-stub error —
# deleting this section changed nothing, and `warn_unused_configs` did not say
# so, because the section *was* matched, just redundantly. Now `pipeline.py`
# imports pandas itself and deleting it is one hard error. Worth knowing before
# reading a green run as evidence that a setting works.
#
# NOT a global `ignore_missing_imports`: that would also swallow a typo'd
# first-party import, which is a bug this gate exists to catch.
module = ["pandas.*"]
ignore_missing_imports = true
