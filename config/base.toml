[project]
name = ""  # User fills in during setup
# authors — who to credit, written to dataset_description.json as BIDS `Authors`
# (the validator warns NO_AUTHORS when it is absent). Set it per project from the
# Setup page, which stores a TOML list:
#
#   authors = ["Jane Doe", "John Roe"]
#
# Shipped commented out rather than as `authors = []`, because an empty list here
# would deep-merge into every project and read as a declaration that a study has
# no authors. Absent means "not stated", which is the truth. Same reason
# [expected] ships commented out.
# Whether to include the BIDS session entity (ses-XX) in paths/filenames:
#   "auto" -> include only when some subject has >1 session; single-session
#             studies omit ses- entirely (matches BIDS convention)
#   true   -> always include;  false -> never include
use_sessions = "auto"

[paths]
bids_dir = ""              # Root BIDS dataset directory
sourcedata_dir = ""        # Where organized DICOMs live (usually <bids_dir>/sourcedata)
# Where per-session reviewed `dcm2bids_config.json` files live, as
# <dcm2bids_config_dir>/sub-XX/[ses-YY]/dcm2bids_config.json.
# Empty (the default) means sourcedata_dir — the historical location.
#
# Set this when sourcedata_dir is NOT writable by whoever runs duckbrain, which
# is the normal case for a shared tree owned by another user: duckbrain saves a
# generated config beside the DICOMs, so an unwritable sourcedata made
# conversion fail at build time. dcm2bids itself only READS the config (the
# sbatch template bind-mounts its directory :ro and passes it to -c), so it does
# not have to sit beside the DICOMs at all.
#
# Reads fall back to sourcedata_dir when nothing is here, so setting this never
# hides reviews already saved beside the DICOMs; saving migrates them here.
dcm2bids_config_dir = ""
derivatives_dir = ""       # Usually <bids_dir>/derivatives
# Scratch for fMRIPrep/MRIQC intermediates — node-local, outside the BIDS tree.
# The BASE only: each job gets <work_dir>/duckbrain-<user>-<project>-<hash>/<step>_<unit>,
# because subject labels restart at 01 in every study and a bare <work_dir>/sub-01
# would be one nipype cache shared by every project that lands on the node. See
# config.unit_work_dir. Jobs clear their own tree when the run looks finished and
# keep it when it does not, so a re-run resumes.
work_dir = "/tmp"
containers_dir = ""        # Singularity .sif/.simg images
nordic_toolbox_dir = ""    # Path to NORDIC_Raw MATLAB toolbox
fs_license = ""            # FreeSurfer license file path

[dcm_source]
# LCNI DICOM export location
base_dir = "/projects/lcni/dcm"
group = ""                 # e.g., "hulacon"
project = ""               # e.g., "mmmdata"

[conversion]
# Run the BIDS validator on the output once dcm2bids finishes. The validator
# ships *inside* the dcm2bids container, so this costs nothing to enable and
# needs no extra install. Findings land in the SLURM log the cockpit already
# shows, and the Project Status page can re-run it on demand.
#
# duckbrain calls `bids-validator --ignoreSymlinks` itself rather than using
# dcm2bids' `--bids_validate`, and the flag is the whole reason: ingestion
# symlinks each session's DICOMs in at sourcedata/sub-XX/dicom, and without it
# the validator follows that symlink and reports every DICOM behind it as
# NOT_INCLUDED — thousands of lines that bury every real finding. No .bidsignore
# entry can suppress them and dcm2bids cannot pass the flag; core/validation.py
# has the full account.
#
# Reports, never blocks: the validator's exit code does not become the job's.
# Structural and naming problems only — it does not check semantic intent, so a
# clean run is not an all-clear (see TODO #16).
bids_validate = true

# Which reconstruction to convert where Siemens saved a series twice — once
# distortion-corrected and once with 'ND' (No Distortion correction) added to the
# name. Both are the same acquisition, so converting both collides on one BIDS
# filename unless they are told apart.
#
#   "corrected"    the distortion-corrected copy (the default, and what
#                  duckbrain has always done)
#   "uncorrected"  the _ND copy
#   "both"         both, distinguished by an acq-dis / acq-nd entity
#
# A project-level choice rather than a per-series one: whoever set the console to
# save both copies did it for the whole study, and a fieldmap's magnitude and
# phase must come from the same reconstruction, so the decision is not per series
# in the first place. Override in a project's own code/duckbrain.toml.
#
# Whatever is asked for, a copy that holds no DICOM files is never chosen over
# one that does — the preference flips and plan_warnings says so.
nd_duplicates = "corrected"

# [expected] — what a session of this study is SUPPOSED to contain.
#
# Deliberately absent here and shipped commented-out: absent means the
# expectation checks do not run, and a study that has not declared its
# expectations is not thereby wrong. It belongs in a PROJECT's own
# code/duckbrain.toml, written by the "Declare expectations" action on the
# Project Status page rather than by hand — see core/expectations.py.
#
# It exists because every other expectation in duckbrain is re-derived from the
# data being judged, so a run that was never acquired shrinks the expectation to
# match and the board reads complete. This is the one declaration that can't.
#
# [expected]
# participants = 37                  # or ["001", "002", ...]
#
# [expected.session]
# fmap_pairs = 1
#
# [expected.session.anat]
# T1w = 1
#
# [expected.session.task]
# div = 4
#
# [expected.exceptions."013"]        # a real, accepted deviation
# reason = "scanner aborted the last run"
# [expected.exceptions."013".task]
# div = 3

[containers]
dcm2bids_version = "3.2.0"
fmriprep_version = "25.2.5"
mriqc_version = "24.0.2"
# QSIPrep moved to CalVer at its "Adopt NiPreps-style packaging" release, so
# 1.1.1 was followed by 26.0.0 — a version that looks like a year is not a typo.
qsiprep_version = "26.0.0"

[fmriprep]
# No resource keys here on purpose. --nprocs is the SLURM allocation's cpus and
# --mem-mb is derived from its memory (config.tool_mem_gb); a second,
# independently-set copy of either is refused at submission rather than ignored.
output_spaces = ["MNI152NLin2009cAsym:res-2", "fsaverage6", "func"]

[nordic]
magnitude_only = true
matlab_module = "matlab/R2024a"
excluded_nodes = ""
# Per-project toggle: when true, fMRIPrep reads the NORDIC-denoised BIDS tree
# (derivatives/nordic/bids_format) and depends on the `nordic` stage instead of
# `converted`. Set in a project's code/duckbrain.toml. NORDIC still runs as a
# pure producer regardless; this only redirects fMRIPrep's input.
use_nordic = false

[qsiprep]
# The diffusion branch (docs/pipeline-extras.md §1). Orthogonal to the BOLD
# pipeline: it reads raw dwi/ and shares nothing with fMRIPrep — not even the
# anatomical, which QSIPrep produces in LPS+ AC-PC-realigned space where
# fMRIPrep's is RAS+ in the original orientation. There is no anat-reuse flag to
# offer and reusing one would be wrong; see core/qsiprep.py.
#
# No resource keys here, for the same reason [fmriprep] has none: --nprocs is the
# SLURM allocation's cpus and --mem-mb is derived from its memory.
#
# output_resolution — the isotropic voxel size in mm everything is resampled to.
# REQUIRED by QSIPrep, with no default, and shipped commented out here on
# purpose (the [expected] precedent): it is a single interpolation and a
# study-level scientific choice, so a wrong value yields data that looks
# entirely usable and is wrongly sampled. duckbrain raises when it is unset
# rather than guessing — a 2.0 default would be a guess dressed as a setting.
# Set it in the PROJECT's code/duckbrain.toml.
#
# output_resolution = 2.0
#
# anatomical_reference — how QSIPrep defines the subject's anatomical space.
# duckbrain's unit is (subject, session) and it launches one session at a time,
# so the only value it accepts for a session-scoped unit is "sessionwise";
# anything else builds ONE reference per subject and writes it at the subject
# level, where the second session launched overwrites the first's anat and
# report with nothing said. Pinning another value is refused at submission
# rather than honoured. A sessionless unit is given "first-lex" instead — with
# no sessions the choices are equivalent, except that QSIPrep's sessionwise
# report branch loops over an empty session list and writes no report at all.
#
# anatomical_reference = "sessionwise"

[freesurfer]
# External FreeSurfer recon stage (docs/pipeline-extras.md §9). When
# use_external is true, the `freesurfer` stage runs the pinned system
# FreeSurfer's recon-all per SUBJECT (all sessions' T1w at once — fMRIPrep 25's
# default subject-level anatomical reference), stages it privately, and imports
# only a completed recon into <derivatives>/fmriprep/sourcedata/freesurfer/ —
# the path fMRIPrep reads with no flag. fMRIPrep then gains --fs-no-resume and
# gates on the recon being complete AND build-stamped with this exact version;
# without both, fMRIPrep would quietly build or resume a recon with its own
# bundled FreeSurfer (7.3.2 in the 25.2 image) instead. Set in a project's
# code/duckbrain.toml.
use_external = false
# The system install to run: <install_root>/<version>/bin/recon-all. On Talapas
# these are Apptainer images behind bash wrappers — plain host commands, but
# containers underneath, so the recon sbatch must never itself run inside a
# container. Pinned rather than trusting whatever `recon-all` is on PATH.
version = "8.2.0"
install_root = "/packages/freesurfer"

[qc]
# Quality-control thresholds. core/qc_guidance.py carries, per measure, why it
# is on the dashboard and what the literature does — and mostly does not —
# support. These three are the only numbers duckbrain applies itself.

# Framewise displacement (mm) above which a volume counts as high-motion when
# duckbrain summarises fMRIPrep confounds. A run-summary convenience, not a
# published exclusion criterion: Power et al. (2012)'s 0.5 mm censors individual
# frames. Distinct from MRIQC's own fd_perc, which is fixed at 0.2 mm inside the
# container and is not configurable from here.
fd_threshold = 0.5

# Mean FD (mm) above which an automated writer records 'investigate' rather than
# 'keep'. A recommendation only — it is never a sign-off.
investigate_threshold = 0.5

# Multiplier for the Tukey IQR fence used to flag outlier runs.
# 1.5 is the standard fence; 3.0 flags only extreme values.
iqr_multiplier = 1.5

[slurm]
# The two partition ROLES. A stage names its role (see `long` below), never a
# partition directly, so a site with different partition names sets these two
# keys once — in the user config or the project config — and every stage follows.
# `partition` was "medium" until 2026-07-22, but every stage overrode it with
# "compute", so it never reached a job; it is spelled "compute" now so removing
# those per-stage lines preserves exactly where jobs already land (TODO #17.2).
partition = "compute"
partition_long = "computelong"
time = "12:00:00"
memory = "16G"
cpus = "4"
email = ""
mail_type = "END,FAIL"
account = ""

[slurm.overrides.dcm2bids]
time = "03:00:00"
memory = "8G"
cpus = "1"

[slurm.overrides.mriqc]
time = "06:00:00"
# The allocation is the authoritative memory number for a stage: MRIQC is handed
# --mem-gb 24 (alloc - 8 GB headroom) derived from it by config.tool_mem_gb.
# 32G holds the one synthstrip that can be resident at a time (12.25 GB measured)
# with room for the rest of the workflow. It does NOT hold two, which is what the
# sbatch's --omp-nthreads exists to prevent — read that comment before raising
# cpus, because on this stage cpus is a memory decision as much as a speed one.
memory = "32G"
# --nprocs comes straight from this, and so does --omp-nthreads. MRIQC would
# otherwise read OMP_NUM_THREADS, which the 24.0.2 image sets to 1, leaving every
# heavy node single-threaded and cpus of them running side by side — the shape
# that OOM-killed 9 of a beta user's 14 runs at this default. Re-measure the
# image's OMP_NUM_THREADS before assuming any of this on a newer one.
cpus = "4"

[slurm.overrides.nordic]
time = "02:00:00"
memory = "32G"
cpus = "4"

[slurm.overrides.freesurfer]
# recon-all is hours per subject even threaded; -threads reads this cpus value.
# Long role: a hard-case brain can exceed the 24 h normal-partition ceiling.
time = "36:00:00"
# FreeSurfer 8's recon-all runs SynthStrip/SynthSeg/SynthMorph by default, and
# mri_synthseg on CPU is the memory peak — 16G was OOM-killed 87 s in on a
# routine T1w (job 46353636, fs8_pilot). 48G holds it with the same headroom
# philosophy as fMRIPrep's allocation; re-measure before trimming.
memory = "48G"
cpus = "4"
long = true

[slurm.overrides.qsiprep]
# UNMEASURED starting points, unlike the mriqc and freesurfer blocks above —
# nothing has run this stage on real data yet, so these are the shape of the
# fMRIPrep allocation rather than a number anyone watched. eddy is hours per
# subject, which is why this takes the long partition role; re-measure and say so
# here once a real run has finished (see TODO #43.3).
time = "48:00:00"
memory = "48G"
cpus = "8"
long = true

[slurm.overrides.fmriprep]
time = "48:00:00"
# fMRIPrep is handed --mem-mb 40960 (alloc - 8 GB headroom) derived from this.
memory = "48G"
# ...and --nprocs 8 straight from this. fMRIPrep then sets its per-process thread
# cap itself, to min(nprocs - 1, 8), so raising cpus is the only knob needed.
cpus = "8"
# The one long-running stage: takes [slurm] partition_long rather than partition.
long = true
