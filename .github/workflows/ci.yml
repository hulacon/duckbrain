# The gate duckbrain went its first two releases without.
#
# Scope is deliberately the checks that can pass on a runner with no cluster:
# no SLURM, no Singularity, no /projects, no scanner data. Everything the test
# suite asserts about job submission it asserts against *rendered* text, which
# is exactly why that suite runs here at all. Live validation stays a Talapas
# job and a note in memory/ — CI cannot replace it and should not pretend to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every trigger above answers "did this diff break it?". None of them can
  # answer "did something break while nobody was pushing?", and that has already
  # happened here: streamlit 1.61.0 was published between two CI runs and turned
  # main red with the repo unchanged (memory/streamlit-161-broke-main). Nothing
  # is pinned against it either — the ruff and mypy bounds exist because those
  # are *gates*, but streamlit is a runtime dependency and pinning it would just
  # move the same surprise to whenever someone raises the pin.
  #
  # Without this, that failure surfaces on whatever the next push happens to be,
  # where it reads as though that diff caused it. This repo has already paid for
  # that confusion once. A weekly run separates "PyPI moved under us" from "you
  # broke it".
  #
  # Monday 15:43 UTC — start of the working week in Eugene (08:43 PDT / 07:43
  # PST; cron here is always UTC and does not follow DST), and deliberately not
  # on the hour, which is when GitHub's scheduler is most congested and most
  # likely to drop or delay a run.
  #
  # Two things to know before trusting it. A scheduled failure is reported
  # against the last commit on main, which did not cause it — read the run's
  # trigger before reading the commit. And **GitHub disables a scheduled
  # workflow in a public repo after 60 days with no repository activity**, so a
  # quiet period switches this off silently; if duckbrain ever goes dormant,
  # re-enable it from the Actions tab rather than assuming it has been running.
  schedule:
    - cron: "43 15 * * 1"

concurrency:
  # Keyed on the event as well as the ref so a cron firing mid-push cannot
  # cancel the run that is actually reporting on someone's commit. Without this
  # they share a group — `github.ref` is `refs/heads/main` for both — and
  # `cancel-in-progress` would let the weekly run kill a real one.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The ends of the supported range. 3.11 is the requires-python floor
      # (raised from 3.10 on 2026-08-17: bids2table>=2.3, the catalog engine's
      # indexer, requires 3.11); 3.12 is where a deprecation lands before it
      # becomes an error, and is what the Talapas shared envs run.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        # Provenance stamps `git describe` of the checkout, so the tag history
        # has to be present or anything touching it degrades differently here
        # than it does for a user.
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import check
        # Cheap, and it catches the failure mode a test suite structurally can't:
        # the seven Streamlit pages are scripts, never imported by any test, so a
        # syntax error in one ships green. This is the only check in CI that
        # looks at them at all.
        #
        # Not `python -m compileall -q src/`: that prints "Can't list 'src/'" and
        # **exits 0** when the path is wrong, so the day the layout moves this
        # step keeps passing while checking nothing. Assert the pages are there
        # before trusting a green compile.
        run: |
          python -c "import duckbrain; print('duckbrain', duckbrain.__version__)"
          python - <<'PY'
          import compileall, pathlib, sys

          pages = sorted(pathlib.Path("src/duckbrain/gui/pages").glob("[0-9]*.py"))
          if not pages:
              sys.exit("no Streamlit pages found under src/duckbrain/gui/pages — layout moved?")
          print(f"compiling {len(pages)} pages + package")
          sys.exit(0 if compileall.compile_dir("src", quiet=1) else 1)
          PY

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        # --cov-fail-under lives in pyproject ([tool.coverage.report]) so a local
        # run and CI enforce the same floor.
        #
        # Bare `--cov`, deliberately: a `--cov=<value>` here *overrides* the
        # source in [tool.coverage.run], so `--cov=duckbrain` measured by module
        # name and silently excluded every Streamlit page — for a week after the
        # config was fixed, this line alone would have kept CI on the old way.
        run: pytest tests/ -q --cov --cov-report=term-missing

  types:
    # A separate job rather than a step in the matrix above, deliberately. The
    # matrix installs different third-party builds on 3.11 and 3.12;
    # `python_version` in [tool.mypy] pins the *analysis* target (which typeshed
    # mypy reads) but not which pandas/pydicom/numpy pip resolved, so a matrix
    # step could go red on one leg alone for reasons nobody changed. One job
    # answers one way, and names itself in the checks list when it fails.
    #
    # That was not a hypothetical: the interpreter this job runs on turned out to
    # decide whether mypy could run at all, for precisely that reason. See below.
    #
    # Blocking, not `continue-on-error`. An advisory check is one nobody reads —
    # the same reason CLAUDE.md refuses to leave a pending check in a commit
    # message. It is only safe to gate on because the config was dialled to a
    # measured zero first (see [tool.mypy]); do not add files here without
    # re-measuring.
    #
    # **On 3.11, the floor, and that has to match `[tool.mypy] python_version`.**
    # (The floor was 3.10 until 2026-08-17; bids2table>=2.3 forced 3.11.) This
    # job once ran on 3.12 for exactly one commit and exited 2 — mypy could not
    # run at all: a floor-pinned `python_version` makes it parse *every* stub
    # with the floor's grammar, and numpy 2.5 (which requires Python >=3.12, so
    # only a 3.12 leg installs it) writes PEP 695 `type X = ...` in its stubs —
    # 3.12 grammar, a blocking syntax error, not an ignorable finding.
    #
    # Running the floor-targeted check *on* the floor makes that impossible by
    # construction: every dependency pip resolves for 3.11 is one that supports
    # 3.11, so its stubs parse at 3.11. Should a package ever ship PEP 695 stubs
    # while still claiming 3.11, the escape is to raise `python_version` or drop
    # the package from the analysis — **not** a per-module
    # `follow_imports = "skip"`, which was measured and does not help: mypy parses
    # the stub before it decides whether to follow it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check
        # Bare `mypy`: the file list lives in [tool.mypy] so a local run checks
        # exactly what CI does. Passing paths here would override it silently.
        #
        # Echoed back as `::error::` workflow annotations, which put the failure
        # on the diff instead of only in a log. Not a nicety: Actions job logs
        # need an authenticated token to read, while annotations are readable
        # from the check-runs API without one, so this is the difference between
        # a failure that can be diagnosed from outside the browser and one that
        # can only be stared at. Covers exit 2 (mypy could not run) as well as
        # exit 1 (type errors) — the first time this job went red it was a 2, and
        # the bare `run: mypy` said nothing about why.
        run: |
          set +e
          out=$(mypy 2>&1); status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$out" | while IFS= read -r line; do
              [ -n "$line" ] && printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"
